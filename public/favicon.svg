<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glass Highlights & Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 'M' Glyph -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#brandGradient)" />

  <!-- Premium Inner Border Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="114" ry="114" fill="none" stroke="url(#glassBorder)" stroke-width="4" opacity="0.8" />

  <!-- Precise Geometric 'M' Letter Glyph -->
  <path d="M 118 145 L 178 145 L 256 257 L 334 145 L 394 145 L 394 367 L 338 367 L 338 235 L 272 330 L 240 330 L 174 235 L 174 367 L 118 367 Z" 
        fill="#ffffff" 
        filter="url(#glyphShadow)" />
</svg>
